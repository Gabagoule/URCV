<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Protocoles">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Protocoles URCV</title>
<!--
  =====================================================================
  Protocoles URCV — version mobile (iPhone / Android, hébergée sur GitHub Pages)
  ---------------------------------------------------------------------
  Style minimaliste : blanc, texte et interface noirs, cadres carrés collés,
  délimitations à peine marquées ; seule la recherche est arrondie.
  Ce fichier contient :
    1. le style
    2. le noyau : navigation (#/ et #/p/<id>), recherche, ouverture des
       cadres, kit d'interface partagé (URCV.ui) et enregistrement des
       protocoles (URCV.register)
  Les protocoles sont des fichiers séparés dans /protocoles, chargés en bas
  de page. Ajouter un protocole = déposer le fichier + une ligne script.
  =====================================================================
-->
<style>
/* ============================ THÈME ============================ */
:root{
  color-scheme: light;
  --bg:#ffffff;
  --ink:#111111;                 /* texte et interface */
  --ink2:#6e6e6e;                /* texte secondaire */
  --ink3:#a8a8a8;                /* indications, unités */
  --line:rgba(0,0,0,.07);        /* délimitation qui se devine */
  --line2:rgba(0,0,0,.14);       /* délimitation un peu plus nette */
  --fill:#f5f5f5;                /* appui, fonds discrets */
  --fill2:#e4e4e4;
  /* accents sourds, réservés au sens clinique (diagnostics, verdicts) */
  --red:#a3262a; --orange:#b2651e; --yellow:#a9861a; --green:#2e6b4c; --blue:#1f3a68;
  --teal:#2b6a72; --purple:#5a3f8a; --indigo:#2e3a87; --pink:#a3335a; --grey:#8a8a8a;
  --serif:ui-serif,"New York","Iowan Old Style","Charter",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
  --ease:cubic-bezier(.65,0,.2,1);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  /* compatibilité avec les noms utilisés par les protocoles */
  --glass:#fff; --glass-strong:#fff; --hair:var(--line); --hi:transparent; --shadow:none; --blur:none;
}

/* ============================ BASE ============================ */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font:16px/1.45 var(--sans);
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
sup{font-size:.7em;line-height:0}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bg{display:none}

/* ============================ BARRE HAUTE ============================ */
.bar{position:fixed;left:0;right:0;top:0;z-index:30;height:calc(var(--st) + 52px);pointer-events:none;
  background:rgba(255,255,255,0);border-bottom:1px solid transparent;transition:background .25s, border-color .25s}
.bar.solid{background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom-color:var(--line);pointer-events:none}
.bar-in{position:absolute;left:0;right:0;top:calc(var(--st) + 4px);height:44px;display:flex;align-items:center;justify-content:center}
.bar-title{font:500 16px/1 var(--serif);max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transform:translateY(4px);transition:opacity .22s, transform .22s}
.bar.solid .bar-title{opacity:1;transform:none}
.bar-btn{pointer-events:auto;position:absolute;top:0;height:44px;min-width:44px;padding:0 10px;border:0;background:none;
  display:flex;align-items:center;justify-content:center;gap:4px;color:var(--ink);font-size:22px;cursor:pointer;transition:opacity .15s}
.bar-btn:active{opacity:.4}
.bar-btn.l{left:6px}.bar-btn.r{right:6px}
.bar-btn[hidden]{display:none}
.bar-btn .lab{font-size:11px;letter-spacing:.2em;text-transform:uppercase}

/* ============================ PAGES ============================ */
main{max-width:720px;margin:0 auto;padding:calc(var(--st) + 60px) 22px calc(var(--sb) + 48px)}
.kicker{display:block;margin:0 0 10px;font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2)}
.large{margin:0;font:600 clamp(30px,8.4vw,40px)/1.08 var(--serif);letter-spacing:-.012em}
.sub{margin:10px 0 0;color:var(--ink2);font-size:15px}
.rule{display:block;width:28px;height:2px;background:var(--ink);margin:20px 0 26px}
#view.push,#view.fade{animation:fade .32s ease-out}
#view.pop{animation:pop .32s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:translateX(-14px)}}

/* ---------- accueil ---------- */
.home-head{position:relative}
.dots{position:absolute;right:0;top:34px;width:44px;height:44px;
  background-image:radial-gradient(var(--ink) 1.1px, transparent 1.3px);background-size:11px 11px;opacity:.55}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--ink);color:var(--ink)}
.search svg{font-size:17px}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;color:var(--ink);font:16px var(--sans);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search-x{border:0;background:none;color:var(--ink2);width:24px;height:24px;display:grid;place-items:center;font-size:16px;padding:0;cursor:pointer}
.search-x[hidden]{display:none}

/* cadres collés, carrés ; on les touche pour les ouvrir */
.frames{margin:26px -22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.frame{position:relative;display:flex;align-items:flex-start;gap:16px;padding:20px 22px 22px;color:inherit;text-decoration:none;background:#fff;transition:background .2s}
.frame + .frame{border-top:1px solid var(--line)}
.frame:active{background:var(--fill)}
.f-num{flex:none;width:22px;padding-top:2px;font:500 12px/1.4 var(--sans);letter-spacing:.08em;color:var(--ink3);font-variant-numeric:tabular-nums}
.f-x{flex:1;min-width:0}
.f-cat{display:block;font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
.f-t{display:block;margin-top:7px;font:500 21px/1.22 var(--serif);letter-spacing:-.005em}
.f-s{display:block;margin-top:5px;font-size:14px;color:var(--ink2);line-height:1.4}
.f-go{flex:none;align-self:center;font-size:20px;color:var(--ink);transition:transform .25s var(--ease)}
.frame:active .f-go{transform:translateX(4px)}
.empty{padding:44px 22px;color:var(--ink2);font-size:15px}
.home-foot{margin-top:34px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}

/* le cadre touché s'agrandit jusqu'à remplir l'écran */
.morph{position:fixed;z-index:40;background:#fff;box-shadow:0 0 0 1px var(--line2);overflow:hidden;
  transition:top .38s var(--ease), left .38s var(--ease), width .38s var(--ease), height .38s var(--ease), opacity .24s}
.morph.go{top:0!important;left:0!important;width:100%!important;height:100%!important}
.morph.out{opacity:0}
.morph .frame{transition:opacity .16s}
.morph.go .frame{opacity:0}

/* ============================ KIT D'INTERFACE (u-) ============================ */
.u-h{margin:30px 0 10px;font-size:11px;font-weight:500;color:var(--ink2);text-transform:uppercase;letter-spacing:.22em}
.u-h:first-child{margin-top:0}
.u-card,.u-list{background:#fff;border:1px solid var(--line);border-radius:0}
.u-card{padding:16px 18px}
.u-list{overflow:hidden}
.u-list.flat{border:0}
/* cadres collés : deux cadres qui se suivent partagent leur trait */
.u-card + .u-card,.u-list + .u-list,.u-card + .u-list,.u-list + .u-card{margin-top:-1px}
.u-blk{position:relative;padding:14px 18px}

/* lignes */
.u-li{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 18px;cursor:default}
.u-li + .u-li::before,.u-blk + .u-li::before,.u-li + .u-blk::before{content:"";position:absolute;top:0;left:18px;right:0;border-top:1px solid var(--line)}
.u-li-t{flex:1;min-width:0;font-size:16px;line-height:1.3}
.u-li-t small{display:block;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.3}
.u-li-col{flex-direction:column;align-items:stretch;gap:9px;padding-top:12px;padding-bottom:14px}
.u-li-btn{width:100%;border:0;background:none;text-align:left;color:var(--ink);cursor:pointer;font-size:15px}
.u-li-btn span{text-decoration:underline;text-decoration-color:var(--ink3);text-underline-offset:4px}
.u-li-btn:active,.u-sel:active{background:var(--fill)}
.u-li-btn svg{font-size:19px}

/* menu déroulant natif (roue iOS) caché sous la ligne */
.u-sel{cursor:pointer}
.u-sel select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer;-webkit-appearance:none;appearance:none;border:0}
.u-sel-v{color:var(--ink);font-size:16px;text-align:right;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-sel-v.ph{color:var(--ink3)}
.u-sel > svg{color:var(--ink3);font-size:15px;margin-left:-6px}

/* interrupteur (noir quand activé) */
.u-switch{position:relative;flex:none;width:48px;height:28px}
.u-switch input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer;z-index:1}
.u-switch i{position:absolute;inset:0;border-radius:999px;background:var(--fill2);transition:background .25s}
.u-switch i::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .3s var(--ease)}
.u-switch input:checked + i{background:var(--ink)}
.u-switch input:checked + i::after{transform:translateX(20px)}
.u-switch input:focus-visible + i{outline:2px solid var(--ink);outline-offset:2px}

/* saisie numérique : un simple trait */
.u-num{display:flex;align-items:baseline;gap:6px;flex:none}
.u-num input{width:84px;border:0;border-bottom:1px solid var(--line2);border-radius:0;background:none;outline:none;text-align:right;color:var(--ink);
  font:17px var(--sans);font-variant-numeric:tabular-nums;padding:3px 0;transition:border-color .2s}
.u-num input:focus{border-bottom-color:var(--ink)}
.u-num input::placeholder{color:var(--ink3)}
.u-num em{font-style:normal;font-size:13px;color:var(--ink2);white-space:nowrap}

/* contrôle segmenté : trait fin, pastille noire qui glisse */
.u-f + .u-f{margin-top:16px}
.u-f-l{font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
.u-seg{--i:0;--n:2;position:relative;display:flex;padding:2px;border-radius:999px;border:1px solid var(--line2);background:#fff}
.u-seg::before{content:"";position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n));border-radius:999px;
  background:var(--ink);transform:translateX(calc(100% * var(--i)));transition:transform .34s var(--ease), opacity .2s}
.u-seg[data-empty]::before{opacity:0}
.u-seg.u-instant::before{transition:opacity .2s}
.u-seg button{flex:1;min-width:0;position:relative;z-index:1;border:0;background:none;cursor:pointer;min-height:36px;padding:6px 6px;
  border-radius:999px;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s}
.u-seg button[aria-pressed="true"]{color:#fff;font-weight:500}

/* verdicts */
.u-pill{flex:none;font-size:10.5px;font-weight:600;letter-spacing:.14em;padding:6px 11px;border-radius:999px;white-space:nowrap;
  color:var(--ink3);border:1px solid var(--line2);background:#fff}
.u-pill.blue,.u-pill.green,.u-pill.red,.u-pill.orange{background:var(--ink);border-color:var(--ink);color:#fff}
.u-pill.amber{color:var(--orange);border-color:var(--orange)}
.u-pill.grey{color:var(--ink2)}
.u-pill.dash{border-style:dashed;border-color:var(--ink3);color:var(--ink2)}

/* bouton capsule noir */
.u-btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 22px;border-radius:999px;border:0;cursor:pointer;
  background:var(--ink);color:#fff;font-size:14px;font-weight:500;letter-spacing:.04em}

/* organigramme : cadres carrés reliés par un trait qui pousse bord à bord */
.u-flow{display:flex;flex-direction:column}
.u-link{width:1px;height:20px;margin:0 auto;background:var(--ink);transform-origin:top;animation:u-grow .26s ease-out both;animation-delay:var(--d,0ms)}
@keyframes u-grow{from{transform:scaleY(0)}}
.u-step{animation:u-rise .34s ease-out both;animation-delay:var(--d,0ms)}
@keyframes u-rise{from{opacity:0;transform:translateY(6px)}}
.u-node{--c:var(--grey);padding:14px 16px;background:#fff;border:1px solid var(--line2)}
.u-node-t{font-size:16px;font-weight:600;line-height:1.3}
.u-node.dx{border-color:var(--ink)}
.u-node.dx .u-node-t{font:600 19px/1.25 var(--serif);display:flex;align-items:baseline;gap:10px}
.u-node.dx .u-node-t::before{content:"";flex:none;width:8px;height:8px;background:var(--c);transform:translateY(-2px)}
.u-node-s{font-size:14px;color:var(--ink2);margin-top:3px;line-height:1.4}
.u-node.dx .u-node-s{padding-left:18px}
.u-node-n{font-size:13px;color:var(--ink2);margin-top:10px}
.u-durees{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;align-items:center}
.u-durees span{display:inline-flex;gap:7px;font-size:13px;padding:4px 9px;border:1px solid var(--line2)}
.u-durees b{font-weight:600}
.u-durees .lab{border:0;padding:4px 2px 4px 0;color:var(--ink2);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.u-warn{margin-top:10px;padding:2px 0 2px 12px;border-left:2px solid var(--orange);font-size:13px;line-height:1.45;color:var(--ink)}
.u-ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:9px}
.u-ul li{font-size:14px;line-height:1.35;padding-left:16px;position:relative}
.u-ul li::before{content:"";position:absolute;left:2px;top:.5em;width:5px;height:5px;background:var(--ink)}
.u-ul li span{display:block;color:var(--ink2);font-size:13px}
.u-hint{font-size:13px;color:var(--ink2);text-align:center;margin-top:14px;font-style:italic;font-family:var(--serif)}
.u-hint:empty{display:none}
.u-foot{font-size:12px;color:var(--ink3);line-height:1.55;margin:30px 0 0}
.u-err{color:var(--red)}

/* feuille modale (monte du bas, carrée) */
.u-sheet-wrap{position:fixed;inset:0;z-index:60}
#layer{transition:opacity .25s}
html.sheet-open #layer{opacity:0;pointer-events:none}
.u-sheet-bg{position:absolute;inset:0;background:rgba(255,255,255,.7);opacity:0;transition:opacity .3s}
.u-sheet{position:absolute;left:0;right:0;margin:0 auto;bottom:0;width:min(640px,100%);max-height:86vh;display:flex;flex-direction:column;
  background:#fff;border-top:1px solid var(--ink);box-shadow:0 -20px 50px rgba(0,0,0,.08);padding-bottom:var(--sb);
  transform:translateY(calc(100% + 30px));transition:transform .4s var(--ease)}
.u-sheet-wrap.open .u-sheet-bg{opacity:1}
.u-sheet-wrap.open .u-sheet{transform:translateY(var(--drag,0px))}
.u-sheet-wrap.drag .u-sheet{transition:none}
.u-sheet-top{touch-action:none;cursor:grab}
.u-grab{width:32px;height:3px;background:var(--fill2);margin:9px auto 0}
.u-sheet-h{display:flex;align-items:center;gap:10px;padding:10px 12px 8px 22px}
.u-sheet-h b{flex:1;font:600 20px/1.2 var(--serif)}
.u-x{width:40px;height:40px;border:0;background:none;color:var(--ink);display:grid;place-items:center;font-size:20px;cursor:pointer;padding:0}
.u-sheet-c{overflow:auto;padding:8px 22px 26px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-in">
    <button type="button" class="bar-btn l" id="btnBack" aria-label="Retour aux protocoles" hidden></button>
    <div class="bar-title" id="barTitle"></div>
    <button type="button" class="bar-btn r" id="btnReset" aria-label="Réinitialiser la page" hidden></button>
  </div>
</header>

<main id="view"></main>
<div id="layer"></div>

<script>
/* =====================================================================
   NOYAU
   ===================================================================== */
(() => {
"use strict";

/* ---------------- icônes (traits fins, 24 × 24) ---------------- */
const ICONS = {
  back:    '<path d="M15 5l-7 7 7 7"/>',
  reset:   '<path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/>',
  chev:    '<path d="M9 5.5l6.5 6.5L9 18.5"/>',
  fleche:  '<path d="M4 12h15.5M14 6.5l5.5 5.5-5.5 5.5"/>',
  updown:  '<path d="M8 9.5l4-4 4 4M8 14.5l4 4 4-4"/>',
  search:  '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  x:       '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  info:    '<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.1"/>',
  goutte:  '<path d="M12 3.5c3.4 4.1 5.6 7.2 5.6 10.1a5.6 5.6 0 0 1-11.2 0c0-2.9 2.2-6 5.6-10.1z"/>',
  pouls:   '<path d="M3 12.5h3.6l2.2-5.5 4.2 10.5 2.3-5h5.7"/>',
  thermo:  '<path d="M14 14.6V5.2a2 2 0 0 0-4 0v9.4a4 4 0 1 0 4 0z"/><path d="M12 10v6"/>',
  check:   '<rect x="5" y="4" width="14" height="17" rx="1"/><path d="M9.2 3.5h5.6M8.6 12.6l2.4 2.4 4.6-5"/>',
  calc:    '<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M8.5 7.5h7M8.6 12h.01M12 12h.01M15.4 12h.01M8.6 16h.01M12 16h.01M15.4 16h.01"/>',
  coeur:   '<path d="M12 20s-7.2-4.4-7.2-10.1A4.1 4.1 0 0 1 12 7.3a4.1 4.1 0 0 1 7.2 2.6C19.2 15.6 12 20 12 20z"/>',
  pilule:  '<rect x="3.5" y="8.5" width="17" height="7" rx="3.5" transform="rotate(-40 12 12)"/><path d="M9.7 9.4l4.9 4.9" />',
  livre:   '<path d="M4.5 5.5A2 2 0 0 1 6.5 3.5h12v15h-12a2 2 0 0 0-2 2z"/><path d="M4.5 20.5a2 2 0 0 1 2-2h12v2"/>'
};
const icon = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ICONS.livre}</svg>`;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sansBalises = s => String(s ?? "").replace(/<[^>]*>/g, "");
// recherche insensible aux accents et à la casse
const norm = s => sansBalises(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const calme = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- kit d'interface partagé par les protocoles ---------------- */
const ui = {
  esc, icon,

  // "12,5" → 12.5 ; vide ou invalide → null
  num(v) {
    const s = String(v ?? "").trim().replace(",", ".");
    if (s === "") return null;
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  },
  fmt(n, d = 0) { return Number(n).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }); },

  // injecte une feuille de style une seule fois (préfixer les classes du protocole)
  css(id, txt) {
    if (document.getElementById("css-" + id)) return;
    const s = document.createElement("style");
    s.id = "css-" + id; s.textContent = txt;
    document.head.appendChild(s);
  },

  /* Contrôle segmenté. opts = [[valeur, libellé, couleur?], …]
     Re-toucher l'option active l'efface (sauf si data-fixed). */
  seg(name, opts, value = null) {
    const i = opts.findIndex(o => String(o[0]) === String(value));
    return `<div class="u-seg" data-seg="${esc(name)}" role="group" style="--n:${opts.length};--i:${Math.max(i, 0)}"${i < 0 ? " data-empty" : ""}>` +
      opts.map(([v, t]) => `<button type="button" data-v="${esc(v)}" aria-pressed="${String(v) === String(value)}">${t}</button>`).join("") +
      `</div>`;
  },
  setSeg(el, value) {
    const bs = [...el.querySelectorAll("button")];
    const i = value == null ? -1 : bs.findIndex(b => b.dataset.v === String(value));
    bs.forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
    if (i < 0) { el.setAttribute("data-empty", ""); return; }
    const etaitVide = el.hasAttribute("data-empty");
    if (etaitVide) el.classList.add("u-instant");          // la pastille apparaît sur place, sans glisser
    el.style.setProperty("--i", i);
    el.removeAttribute("data-empty");
    if (etaitVide) { void el.offsetWidth; el.classList.remove("u-instant"); }
  },
  onSeg(root, cb) {
    root.addEventListener("click", e => {
      const b = e.target.closest(".u-seg button");
      if (!b || !root.contains(b)) return;
      const el = b.parentElement;
      const v = b.getAttribute("aria-pressed") === "true" && !el.hasAttribute("data-fixed") ? null : b.dataset.v;
      ui.setSeg(el, v);
      cb(el.dataset.seg, v, el);
    });
  },

  /* Ligne « menu » : le <select> natif est invisible par-dessus (roue iOS).
     opts = [[valeur, libellé], …] ; sans valeur par défaut → option vide « Choisir ». */
  selRow(name, label, opts, value = null, { sub = "", placeholder = "Choisir" } = {}) {
    const cur = opts.find(o => String(o[0]) === String(value));
    const vide = value == null ? `<option value="">${esc(placeholder)}</option>` : "";
    return `<label class="u-li u-sel"><span class="u-li-t">${label}${sub ? `<small>${sub}</small>` : ""}</span>` +
      `<span class="u-sel-v${cur ? "" : " ph"}">${cur ? esc(cur[1]) : esc(placeholder)}</span>${icon("updown")}` +
      `<select data-sel="${esc(name)}" aria-label="${esc(sansBalises(label))}">${vide}` +
      opts.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(value) ? " selected" : ""}>${esc(t)}</option>`).join("") +
      `</select></label>`;
  },
  onSel(root, cb) {
    root.addEventListener("change", e => {
      const s = e.target.closest("select[data-sel]");
      if (!s) return;
      const lab = s.parentElement.querySelector(".u-sel-v");
      lab.textContent = s.selectedOptions[0] ? s.selectedOptions[0].textContent : "";
      lab.classList.toggle("ph", s.value === "");
      cb(s.dataset.sel, s.value === "" ? null : s.value, s);
    });
  },

  /* Ligne avec interrupteur */
  swRow(name, label, checked = false, sub = "") {
    return `<label class="u-li"><span class="u-li-t">${label}${sub ? `<small>${sub}</small>` : ""}</span>` +
      `<span class="u-switch"><input type="checkbox" role="switch" data-sw="${esc(name)}"${checked ? " checked" : ""}><i></i></span></label>`;
  },
  onSw(root, cb) {
    root.addEventListener("change", e => {
      const i = e.target.closest("input[data-sw]");
      if (i) cb(i.dataset.sw, i.checked, i);
    });
  },

  /* Ligne de saisie numérique (virgule acceptée), unité à droite */
  numRow(name, label, unit = "", { sub = "" } = {}) {
    return `<label class="u-li"><span class="u-li-t">${label}${sub ? `<small>${sub}</small>` : ""}</span>` +
      `<span class="u-num"><input type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="—" data-num="${esc(name)}" aria-label="${esc(sansBalises(label))}">${unit ? `<em>${unit}</em>` : ""}</span></label>`;
  },
  onNum(root, cb) {
    root.addEventListener("input", e => {
      const i = e.target.closest("input[data-num]");
      if (i) cb(i.dataset.num, ui.num(i.value), i);
    });
  },

  field(label, html) { return `<div class="u-f"><div class="u-f-l">${label}</div>${html}</div>`; },
  pill(txt, kind = "") { return `<span class="u-pill ${kind}">${txt}</span>`; },

  /* Organigramme. node : cadre ; dx : cadre « diagnostic » (trait noir, titre serif, carré de couleur) */
  node({ tone = "grey", dx = false, titre = "", sous = "", corps = "" }) {
    return `<div class="u-node${dx ? " dx" : ""}" style="--c:var(--${tone})"><div class="u-node-t">${titre}</div>` +
      `${sous ? `<div class="u-node-s">${sous}</div>` : ""}${corps}</div>`;
  },
  // relie les cadres par des traits qui poussent, cadre après cadre
  chain(nodes, { lead = true } = {}) {
    let d = 0, out = "";
    nodes.forEach((n, k) => {
      if (k > 0 || lead) { out += `<div class="u-link" style="--d:${d}ms"></div>`; d += 110; }
      out += `<div class="u-step" style="--d:${d}ms">${n}</div>`;
      d += 130;
    });
    return `<div class="u-flow">${out}</div>`;
  },
  durees(items, lab = "") {
    return `<div class="u-durees">${lab ? `<span class="lab">${lab}</span>` : ""}${items.map(([n, v]) => `<span>${n}<b>${v}</b></span>`).join("")}</div>`;
  },

  /* Feuille modale qui monte du bas ; se ferme au tap sur le fond, à la croix ou en la tirant vers le bas */
  sheet(titre, html) {
    const w = document.createElement("div");
    w.className = "u-sheet-wrap";
    w.innerHTML = `<div class="u-sheet-bg"></div>
      <div class="u-sheet" role="dialog" aria-modal="true" aria-label="${esc(sansBalises(titre))}">
        <div class="u-sheet-top"><div class="u-grab"></div>
          <div class="u-sheet-h"><b>${titre}</b><button type="button" class="u-x" aria-label="Fermer">${icon("x")}</button></div></div>
        <div class="u-sheet-c">${html}</div>
      </div>`;
    document.body.appendChild(w);
    document.documentElement.style.overflow = "hidden";
    document.documentElement.classList.add("sheet-open");
    requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add("open")));
    let ferme = false;
    const close = () => {
      if (ferme) return; ferme = true;
      w.style.removeProperty("--drag");
      w.classList.remove("open", "drag");
      document.documentElement.style.overflow = "";
      document.documentElement.classList.remove("sheet-open");
      ui._sheets.delete(close);
      setTimeout(() => w.remove(), 380);
    };
    w.querySelector(".u-sheet-bg").addEventListener("click", close);
    w.querySelector(".u-x").addEventListener("click", close);
    // glisser vers le bas pour fermer
    const top = w.querySelector(".u-sheet-top");
    let y0 = null, dy = 0;
    top.addEventListener("pointerdown", e => { if (e.target.closest(".u-x")) return; y0 = e.clientY; dy = 0; w.classList.add("drag"); top.setPointerCapture(e.pointerId); });
    top.addEventListener("pointermove", e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); w.style.setProperty("--drag", dy + "px"); });
    const fin = () => { if (y0 == null) return; y0 = null; w.classList.remove("drag"); if (dy > 90) close(); else w.style.setProperty("--drag", "0px"); };
    top.addEventListener("pointerup", fin);
    top.addEventListener("pointercancel", fin);
    ui._sheets.add(close);
    return { close };
  },
  _sheets: new Set(),

  // calque pour les éléments flottants (vidé à chaque changement de page)
  get layer() { return document.getElementById("layer"); }
};

/* ---------------- registre des protocoles ----------------
   URCV.register({
     id: "ilc",                       // utilisé dans l'adresse #/p/ilc
     titre: "…", court: "…",          // grand titre / titre de la barre
     sous: "…",                       // sous-titre (accueil + page)
     cat: "Infectiologie",            // petite mention au-dessus du titre
     icone: "goutte",                 // icône éventuelle dans le protocole
     mots: "mots-clés pour la recherche",
     render(root, ui) { … ; return fonctionDeNettoyage? }
   })
*/
const protos = [];
function register(def) {
  if (!def || !def.id || typeof def.render !== "function") return console.warn("Protocole invalide", def);
  if (protos.some(p => p.id === def.id)) return console.warn("Protocole en double :", def.id);
  protos.push(def);
}
window.URCV = { register, ui };

/* ---------------- navigation ---------------- */
const $ = s => document.querySelector(s);
const view = $("#view"), bar = $("#bar"), barTitle = $("#barTitle"), btnBack = $("#btnBack"), btnReset = $("#btnReset");
btnBack.innerHTML = icon("back");
btnReset.innerHTML = icon("reset");
if ("scrollRestoration" in history) history.scrollRestoration = "manual";

let current = null;       // null au démarrage, "home" ou l'objet protocole
let cleanup = null;       // fonction de nettoyage renvoyée par render()
let fromHome = false;     // ouvert depuis l'accueil → « retour » = history.back()
let homeY = 0;            // position de défilement de l'accueil
let query = "";           // texte de recherche conservé
let io = null;

function quitter() {
  if (typeof cleanup === "function") { try { cleanup(); } catch (e) { console.error(e); } }
  cleanup = null;
  [...ui._sheets].forEach(f => f()); ui._sheets.clear();
  ui.layer.innerHTML = "";
  if (io) { io.disconnect(); io = null; }
}
function animer(cls) {
  view.classList.remove("push", "pop", "fade");
  void view.offsetWidth;
  view.classList.add(cls);
}
view.addEventListener("animationend", e => { if (e.target === view) view.classList.remove("push", "pop", "fade"); });

// barre blanche + petit titre dès que le grand titre passe sous la barre
function suivreTitre(el) {
  bar.classList.remove("solid");
  if (!el || !("IntersectionObserver" in window)) return;
  const h = Math.round(bar.getBoundingClientRect().height);
  io = new IntersectionObserver(([en]) => bar.classList.toggle("solid", !en.isIntersecting), { rootMargin: `-${h}px 0px 0px 0px` });
  io.observe(el);
}

function ouvrirAccueil() {
  const avant = current;
  quitter();
  current = "home";
  document.title = "Protocoles URCV";
  barTitle.textContent = "Protocoles";
  btnBack.hidden = true; btnReset.hidden = true;
  view.innerHTML = `
    <div class="home-head">
      <span class="dots" aria-hidden="true"></span>
      <span class="kicker">URCV — Réanimation cardio-vasculaire</span>
      <h1 class="large">Protocoles</h1>
      <span class="rule"></span>
    </div>
    <label class="search">${icon("search")}
      <input type="search" placeholder="Rechercher" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Rechercher un protocole">
      <button type="button" class="search-x" aria-label="Effacer" hidden>${icon("x")}</button>
    </label>
    <nav class="frames"></nav>
    <p class="home-foot">CHU Timone · AP-HM</p>`;
  const inp = view.querySelector(".search input"), x = view.querySelector(".search-x");
  inp.value = query;
  const maj = () => { query = inp.value; x.hidden = !query; dessinerCadres(); };
  inp.addEventListener("input", maj);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
  x.addEventListener("click", e => { e.preventDefault(); inp.value = ""; maj(); inp.focus(); });
  // toucher un cadre : il s'agrandit jusqu'à remplir l'écran, puis le protocole s'affiche
  view.querySelector(".frames").addEventListener("click", e => {
    const a = e.target.closest("a.frame");
    if (!a || calme()) return;
    e.preventDefault();
    ouvrirCadre(a);
  });
  maj();
  suivreTitre(view.querySelector(".large"));
  if (avant && avant !== "home") { animer("pop"); requestAnimationFrame(() => window.scrollTo(0, homeY)); }
}

function dessinerCadres() {
  const box = view.querySelector(".frames");
  const mots = norm(query).trim().split(/\s+/).filter(Boolean);
  const liste = protos.filter(p => {
    const txt = norm([p.titre, p.court, p.sous, p.cat, p.mots].join(" "));
    return mots.every(m => txt.includes(m));
  });
  if (!liste.length) { box.innerHTML = `<div class="empty">Aucun résultat pour « ${esc(query.trim())} »</div>`; return; }
  box.innerHTML = liste.map(p => `
    <a class="frame" href="#/p/${esc(p.id)}">
      <span class="f-num">${String(protos.indexOf(p) + 1).padStart(2, "0")}</span>
      <span class="f-x">
        ${p.cat ? `<span class="f-cat">${esc(p.cat)}</span>` : ""}
        <span class="f-t">${p.titre}</span>
        ${p.sous ? `<span class="f-s">${p.sous}</span>` : ""}
      </span>
      <span class="f-go">${icon("fleche")}</span>
    </a>`).join("");
}

function ouvrirCadre(a) {
  const r = a.getBoundingClientRect();
  const m = document.createElement("div");
  m.className = "morph";
  Object.assign(m.style, { top: r.top + "px", left: r.left + "px", width: r.width + "px", height: r.height + "px" });
  const copie = a.cloneNode(true);
  copie.style.width = r.width + "px";
  m.appendChild(copie);
  document.body.appendChild(m);
  void m.offsetWidth;
  m.classList.add("go");
  let fait = false;
  const suite = () => {
    if (fait) return; fait = true;
    location.hash = a.getAttribute("href");
    requestAnimationFrame(() => { m.classList.add("out"); setTimeout(() => m.remove(), 280); });
  };
  m.addEventListener("transitionend", e => { if (e.propertyName === "height") suite(); });
  setTimeout(suite, 480);   // sécurité si transitionend ne vient pas
}

function ouvrirProtocole(p, reinit = false) {
  const avant = current;
  if (avant === "home") homeY = window.scrollY;
  quitter();
  current = p;
  document.title = `${sansBalises(p.court || p.titre)} · Protocoles URCV`;
  barTitle.textContent = sansBalises(p.court || p.titre);
  btnBack.hidden = false; btnReset.hidden = false;
  view.innerHTML = `
    ${p.cat ? `<span class="kicker">${esc(p.cat)}</span>` : ""}
    <h1 class="large">${p.titre}</h1>
    ${p.sous ? `<p class="sub">${p.sous}</p>` : ""}
    <span class="rule"></span>
    <div class="proto" data-proto="${esc(p.id)}"></div>`;
  window.scrollTo(0, 0);
  const root = view.querySelector(".proto");
  try { cleanup = p.render(root, ui) || null; }
  catch (err) {
    console.error(err);
    root.innerHTML = `<div class="u-card u-err">Erreur dans le protocole « ${esc(p.id)} » : ${esc(err.message)}</div>`;
  }
  suivreTitre(view.querySelector(".large"));
  if (reinit) animer("fade"); else if (avant) animer("push");
}

function router() {
  const m = location.hash.match(/^#\/p\/([\w-]+)/);
  const p = m && protos.find(x => x.id === m[1]);
  if (p) { fromHome = current === "home"; ouvrirProtocole(p); }
  else ouvrirAccueil();
}

btnBack.addEventListener("click", () => { if (fromHome) history.back(); else location.hash = "#/"; });
btnReset.addEventListener("click", () => { if (current && current !== "home") ouvrirProtocole(current, true); });
// « OK » du clavier numérique : on ferme le clavier
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input[data-num], input[inputmode]")) e.target.blur(); });
window.addEventListener("hashchange", router);
document.addEventListener("DOMContentLoaded", router);   // après le chargement des protocoles (scripts « defer »)

/* ---------------- hors-ligne (GitHub Pages uniquement) ---------------- */
if ("serviceWorker" in navigator && location.protocol === "https:" && !window.URCV_NO_SW) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
})();
</script>
